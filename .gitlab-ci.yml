stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - cd /builds/canadageguofu/cicddemo/.git/
    - whoami
    - pwd
    - echo ${PATH}
     - ls -lh $(which npm)
    - npm run start
    - npm -v
    - npm install
  artifacts:
    paths:
      - node_modules/

test:
  stage: test
  script:
    - npm test

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
  only:
    - master

